# Runs only when a v<version> tag is pushed; pushes to master trigger nothing.
# It builds and tests the tagged commit, then scripts/release.mjs records a
# prebuilt commit (the same tree plus lib/, with `prepare` removed) whose
# parent is the tagged commit, and this job pushes it as dist/v<version>.
# Installing github:<owner>/<repo>#dist/v<version> needs no devDependencies
# or build. No branch is created.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # npm ci runs `prepare`; release.mjs rebuilds lib/ from scratch anyway.
      - run: npm ci

      - name: Build, test and create the dist commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.mjs

      - name: Push the dist tag
        run: git push origin "refs/tags/dist/$GITHUB_REF_NAME"
